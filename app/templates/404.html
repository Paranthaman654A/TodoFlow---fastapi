{% extends "base.html" %}

{% block title %}
404 | Todo App
{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-card">

        <div class="error-code">
            404
        </div>

        <div class="error-icon">
            ?
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            The page you're looking for doesn't exist
            or may have been moved.
        </p>

        <a
            href="/"
            class="primary-btn"
        >
            Go Back Home
        </a>

    </div>

</div>

{% endblock %}
