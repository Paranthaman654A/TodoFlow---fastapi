{% extends "base.html" %}

{% block title %}
Create Account | Todo App
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="logo-section">

            <div class="logo-icon">
                ✓
            </div>

            <h1>
                Todo<span>Flow</span>
            </h1>

            <p>
                Start organizing your day.
            </p>

        </div>


        {% if message %}

            <div class="flash-message error">
                {{ message }}
            </div>

        {% endif %}


        <div class="auth-header">

            <h2>
                Create Account
            </h2>

            <p>
                Create your account to get started
            </p>

        </div>


        <form
            action="/auth/register"
            method="POST"
            class="auth-form"
            id="registerForm"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    minlength="3"
                    maxlength="50"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >

            </div>


            <p
                id="passwordError"
                class="form-error"
            ></p>


            <button
                type="submit"
                class="primary-btn"
            >
                Create Account
            </button>

        </form>


        <div class="auth-footer">

            <p>

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
